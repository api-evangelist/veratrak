name: Veratrak
description: >-
  Veratrak is a supply-chain collaboration and visibility platform for the
  life-sciences and pharmaceutical industry. Its product, The Hub, aggregates
  external operations data from contract manufacturers (CMOs/CDMOs), third-party
  logistics providers (3PLs) and suppliers into a single, secure, compliant view
  covering batch status, inventory positions, production schedules, quality
  events and shipment tracking across a partner network. The Hub is format- and
  protocol-agnostic, exchanging data as CSV, XML, EDI or JSON over SFTP, AS2 or
  API, and offers API extensions that let pharma organisations connect internal
  systems to external suppliers with minimal IT effort. The platform is ISO
  27001:2022 and ISO 9001:2015 certified and GDPR compliant. Veratrak is a
  Seedcamp portfolio company.
